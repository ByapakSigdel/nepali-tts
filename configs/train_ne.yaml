# Lightning config: checkpoint frequently so we can auto-resume after the
# intermittent Blackwell/WSL CUDA faults. Only keeps last.ckpt (overwritten) to save disk.
trainer:
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: /home/byapak/voicemodel/models/ne_stageA/ckpts
        every_n_train_steps: 200
        save_last: true
        save_top_k: 0
