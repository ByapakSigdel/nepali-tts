# Stage B (SLR54, ~112h / 527 speakers). Same fault-tolerant checkpointing as Stage A, but paths
# point under models/ne_stageB so it never touches the Stage-A run.
trainer:
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: /home/byapak/voicemodel/models/ne_stageB/ckpts
        every_n_train_steps: 100
        save_last: true
        save_top_k: 0
    - class_path: status_writer.StatusWriter
      init_args:
        path: /home/byapak/voicemodel/models/ne_stageB/status.txt
        every_n_steps: 10
